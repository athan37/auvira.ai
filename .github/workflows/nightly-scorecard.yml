name: Nightly accuracy scorecard

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run test:contracts

  # Live LLM suites are manual only (cost). Run locally when needed:
  #   npm run test:llm:contracts
  #   npm run test:llm
  #   npm run test:all:llm
