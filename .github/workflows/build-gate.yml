name: Build gate

on:
  pull_request:
    paths:
      - 'src/lib/builder/**'
      - 'src/lib/agent/buildWebsiteFromPlan.ts'
      - 'src/lib/agent/convertPlanToSiteSpec.ts'
      - 'scripts/test-build-gate-local.ts'
      - 'tests/validateGeneratedSite.test.ts'

jobs:
  build-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run test:contracts
      - name: validateGeneratedSite unit tests
        run: node --env-file=.env ./node_modules/vitest/vitest.mjs run tests/validateGeneratedSite.test.ts
